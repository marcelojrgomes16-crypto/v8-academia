services:
  - type: web
    name: v8-academia
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npx prisma db seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: v8-academia-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://v8-academia.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://v8-academia.onrender.com

databases:
  - name: v8-academia-db
    plan: free
    databaseName: v8_academia
